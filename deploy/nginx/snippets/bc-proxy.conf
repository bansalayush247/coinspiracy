# Proxy to the game server: strips /colyseus, passes WebSocket upgrades, and sets the client address itself.
rewrite ^/colyseus(/.*)$ $1 break;
proxy_pass http://bc_game;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $bc_connection;
# Overwrite, never append: the server trusts X-Real-IP only from TRUSTED_PROXIES.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Client-IP "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# Long enough for an idle match socket; Colyseus pings well inside this.
proxy_read_timeout 3600s;
proxy_buffering off;
proxy_redirect off;
