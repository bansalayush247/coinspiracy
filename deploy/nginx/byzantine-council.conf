# Byzantine Council: the site on example.org, the game on play.example.org with the server at /colyseus/.
# Include from the http block (e.g. /etc/nginx/conf.d/). Replace example.org everywhere before use.

# Rate-limit keys live in shared memory only; no client address is ever logged.
limit_req_zone $binary_remote_addr zone=bc_matchmake:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=bc_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=bc_static:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bc_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Access logs: no client address, no query string (socket URLs carry reconnection tokens), a coarse route for the game.
log_format bc_static '$time_iso8601 $host "$request_method $uri" $status $body_bytes_sent $request_time';
log_format bc_game '$time_iso8601 $host "$request_method $bc_route" $status $body_bytes_sent $request_time';

map $uri $bc_route {
    default                      /colyseus/(socket);
    ~^/colyseus/matchmake/       /colyseus/matchmake;
    ~^/colyseus/api/             /colyseus/api;
    /colyseus/healthz            /colyseus/healthz;
}

# $bc_frame_ancestors: who may frame the game (Discord Activity, web portals); 'none' unless FRAME_ANCESTORS is set.
include /etc/nginx/snippets/bc-frame-ancestors.conf;

map $http_upgrade $bc_connection {
    default upgrade;
    ''      close;
}

upstream bc_game {
    server 127.0.0.1:2567;
    keepalive 16;
}

server_tokens off;

# Plain http: ACME challenges, then a permanent redirect.
server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org play.example.org;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# Unknown names over TLS: refuse the handshake rather than serve a default certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
}

# www redirects to the bare domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.org;
    include /etc/nginx/snippets/bc-tls.conf;
    access_log off;
    return 301 https://example.org$request_uri;
}

# The Astro site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.org;
    include /etc/nginx/snippets/bc-tls.conf;
    root /opt/byzantine-council/current/apps/site/dist;
    access_log /var/log/nginx/bc-site.log bc_static;
    error_log /var/log/nginx/bc-error.log crit;
    limit_req zone=bc_static burst=40 nodelay;
    client_max_body_size 1k;
    error_page 404 /404.html;

    include /etc/nginx/snippets/bc-site-headers.conf;
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri $uri/index.html =404; }
    location /_astro/ {
        include /etc/nginx/snippets/bc-site-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/(og|screens)/ {
        include /etc/nginx/snippets/bc-site-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    # _headers is for static hosts only.
    location = /_headers { return 404; }
}

# The game client, and the game server under /colyseus/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.org;
    include /etc/nginx/snippets/bc-tls.conf;
    root /opt/byzantine-council/current/apps/client/dist;
    access_log /var/log/nginx/bc-play.log bc_static;
    error_log /var/log/nginx/bc-error.log crit;
    client_max_body_size 2k;

    include /etc/nginx/snippets/bc-play-headers.conf;
    add_header Cache-Control "no-cache" always;

    # The single page; nothing else falls back to it, so a missing script is a 404, never cached HTML.
    location = / { limit_req zone=bc_static burst=40 nodelay; try_files /index.html =404; }
    location = /index.html { limit_req zone=bc_static burst=40 nodelay; }
    location = /sw.js { limit_req zone=bc_static burst=40 nodelay; }
    location = /manifest.webmanifest { limit_req zone=bc_static burst=40 nodelay; }
    location /assets/ {
        limit_req zone=bc_static burst=80 nodelay;
        include /etc/nginx/snippets/bc-play-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /icons/ {
        include /etc/nginx/snippets/bc-play-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location = /favicon.svg { }
    location = /_headers { return 404; }
    location / { return 404; }

    location /colyseus/matchmake/ {
        limit_req zone=bc_matchmake burst=6 nodelay;
        access_log /var/log/nginx/bc-play.log bc_game;
        include /etc/nginx/snippets/bc-proxy.conf;
    }
    location /colyseus/api/ {
        limit_req zone=bc_api burst=30 nodelay;
        access_log /var/log/nginx/bc-play.log bc_game;
        include /etc/nginx/snippets/bc-proxy.conf;
    }
    # Room sockets and the code lookup; the server applies its own per-network limits too.
    location /colyseus/ {
        limit_conn bc_conn 32;
        limit_req zone=bc_api burst=30 nodelay;
        access_log /var/log/nginx/bc-play.log bc_game;
        include /etc/nginx/snippets/bc-proxy.conf;
    }
}
